# The source list for stage 20 — the only hand-edited file under context/. [st-h0xx]
#
# Every row names lines of one file at one commit. bin/excerpts.py turns each
# row into a generated excerpt file in the run folder, refuses when the lines
# at HEAD no longer match the pinned commit ("canon moved, re-pin"), refuses a
# path outside allowed_paths, a file in refused_files, or a status the lane
# does not admit. The classify stage can cite a row id and nothing else, and
# bin/checker.py fails the run when a label's quoted words are not in the
# row's excerpt word for word.
#
# Who edits this: Strader curates it below Steve (his direct edits stand).
# COO seeded it 2026-08-29 from the lines the plan measured on 2026-08-28. A
# change is a commit with a bead id and a ledger row, never a silent edit.
#
# Status words (Steve, 2026-08-28: say "trusted", not "canon"):
#   trusted      — a rule Steve runs, in knowledge/
#   exploratory  — in knowledge/ but marked a candidate, not settled method;
#                  the prompt says the status aloud when it cites such a row
#   code         — a definition that exists only in code (decision 1, Steve
#                  2026-08-28: admissible for the three setup names with no
#                  knowledge file, marked "code, not canon"; retires when the
#                  playbook refactor gives them entities)
#   under-review, tabled, withdrawn — refused by bin/excerpts.py
