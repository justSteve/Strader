# execd bounds — Steve's file. [st-eznu, epic st-5qjq]
#
# The service reads this at start-up from /etc/execd/bounds.yaml. Stage 3's
# deploy/install.sh copies this example there once; after that it is Steve's
# to edit, and the service is restarted to pick up a change.
#
# Every value here is his. The SHAPE of the bounds is not configurable — there
# is no key that switches a bound off, because a bound you can switch off is
# not a bound. An unknown key is a start-up error rather than a silent default,
# so a typo cannot leave the service running under limits he did not choose.
#
# These are the start values from the design (§3). Delete any line to take the
# default; delete the file entirely and the service runs on all of them.

# What may be traded at all. Roots, not symbols.
instruments: [SPX, SPXW]

# Contracts per order. The fire server's cap today.
qty_cap: 1

# No daily loss ceiling, no limit on how many positions are open, and no
# count of attempts or losing trades — removed 2026-09-24 and not to come
# back. Steve, 2026-09-17: "Let's just completely remove that complete
# calculation. I don't need that level of hand holding." And 2026-09-24:
# "make sure they are removed now and not restored in the future."
# A file that still carries max_open_positions, daily_loss_ceiling_usd or
# max_attempts loads; those lines are ignored and can be deleted.

# No clock rules. There is no session window, no no-new-entries cutoff, no
# weekdays-only and no flat-by-close: nothing here refuses, closes or locks
# because of the time of day (Steve, 2026-09-24: "never ever place that kind
# of restriction on me ... As 0DTE trades, if i don't close them, they
# expire. flat. But I will _never ask that you do it automatically.").
# A file that still carries open_ct, close_ct, no_open_after_ct,
# flat_by_close_ct or weekdays_only loads; those lines are ignored and can
# be deleted.

# Price sanity. A limit must sit within this fraction of the live touch, and a
# quote older than max_quote_age_s is not a live quote.
price_band_pct: 0.10
max_quote_age_s: 30.0

# The last gate before a send: if the broker's own preview prices the order
# more than this above what the intent allows, it is not transmitted.
preview_cost_tolerance_usd: 5.00

# Every entry must carry the stop_spx and delta the broker-resident protective
# stop is derived from. This key exists only so the refusal has something to
# name: `false` is not a setting, it is a bounds file that will not load.
require_protective_stop: true

# The take-profit half of the bracket (Steve, 2026-09-14: "upon fill, api
# should create a resting order at a 10x profit target"). On every fill the
# service rests a sell limit at the target beside the stop, and the two are
# one bracket: when either fills the other is cancelled at once.
#
# Two readings of "10x", and the basis picks one:
#   premium — the target is the fill price times the multiple. A $2.10 fill
#             rests a sell at $21.00.
#   risk    — the target is the fill price plus the multiple times the
#             distance to the stop. A $2.10 fill with a $1.50 stop (60 cents
#             of risk) rests a sell at $8.10.
# RULED: premium (Steve, 2026-09-15: "10x means ten times the fill
# premium"). Flipping the basis here is still a one-line edit, no code change.
# The multiple must be positive, and above 1 on the premium basis (a target
# at or under the fill is a sale, not a target). Rounded up to the tick.
# 5x since 2026-09-25 (Steve: "We can lower the take profit % to 5X. In
# practice I'll be sitting on a ready order to change that according to
# conditions at the time"), of the entry's LIMIT: the bracket goes to Schwab
# with the entry, before any fill exists.
take_profit_multiple: 5.0
take_profit_basis: premium
