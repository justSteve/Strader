# execd bounds — Steve's file. [st-eznu, epic st-5qjq]
#
# The service reads this at start-up from /etc/execd/bounds.yaml. Stage 3's
# deploy/install.sh copies this example there once; after that it is Steve's
# to edit, and the service is restarted to pick up a change.
#
# Every value here is his. The SHAPE of the bounds is not configurable — there
# is no key that switches a bound off, because a bound you can switch off is
# not a bound. An unknown key is a start-up error rather than a silent default,
# so a typo cannot leave the service running under limits he did not choose.
#
# These are the start values from the design (§3). Delete any line to take the
# default; delete the file entirely and the service runs on all of them.

# What may be traded at all. Roots, not symbols.
instruments: [SPX, SPXW]

# Contracts per order. The fire server's cap today.
qty_cap: 1

# How many may be open at once.
max_open_positions: 1

# The hard ceiling on the day's damage, and how many attempts may be used.
# An attempt is a filled position (Steve, 2026-09-14): it is held while the
# position is open and kept only if the position closes at a loss — a close
# at break-even or better gives its attempt back. A working entry that has
# not filled holds a position slot but no attempt. A winning trade never
# raises the ceiling — that bounds how much of the day can go wrong, it is
# not a running P&L. Both are rebuilt from the journal, so a restart does not
# reset them.
#
# It bounds two things. Loss ALREADY REALIZED: once it reaches the ceiling, no
# new entry. And the worst case of the entry IN FRONT OF IT: an entry is priced
# at its limit, walked down to the stop it would rest, and refused if that
# exceeds the headroom left. The second is what makes the sum of the day's
# worst cases fit inside the ceiling rather than merely the first one.
#
# So this number has to be larger than one position can lose or it can never
# bind at all: a $2.10 SPX call with a twelve-point stop risks $205 whatever
# the ceiling says.
daily_loss_ceiling_usd: 500.0
# 2 → 10, Steve 2026-09-14: "adjust rule that puts the number of loss
# transactions from 2 up to 10. the $500 limit remains as is." The seed
# matches his live file so a fresh install does not quietly revert it. Ten
# LOSING attempts, per the rule above.
max_attempts: 10

# The session, in Central time. NOT APPLIED TO SPX/SPXW ENTRIES since
# 2026-09-14 (Steve: "revoke the trading-hours rule when SPX is the target
# instrument"); kept for any other root, and an unlock after close_ct arms
# until the end of the day. Nothing opens after no_open_after_ct; exits are
# not gated by any of these.
open_ct: "08:30"
close_ct: "15:00"
no_open_after_ct: "14:50"

# When the service closes the day out by its own hand. Steve's ruling,
# 2026-09-18 ("9j8e is flat"): the bracket's legs are DAY orders and a
# position is not, so nothing is carried past the bell. At this hour the
# watcher cancels every working entry and sells everything held at market,
# through FLATTEN, which no bound refuses. Must sit between no_open_after_ct
# and close_ct. Changing it is his; removing it is not — a DAY bracket with
# no hand to flatten the position it protects is the hole audit finding 38
# opened.
flat_by_close_ct: "14:55"
weekdays_only: true

# Price sanity. A limit must sit within this fraction of the live touch, and a
# quote older than max_quote_age_s is not a live quote.
price_band_pct: 0.10
max_quote_age_s: 30.0

# The last gate before a send: if the broker's own preview prices the order
# more than this above what the intent allows, it is not transmitted.
preview_cost_tolerance_usd: 5.00

# Every entry must carry the stop_spx and delta the broker-resident protective
# stop is derived from. This key exists only so the refusal has something to
# name: `false` is not a setting, it is a bounds file that will not load.
require_protective_stop: true

# The take-profit half of the bracket (Steve, 2026-09-14: "upon fill, api
# should create a resting order at a 10x profit target"). On every fill the
# service rests a sell limit at the target beside the stop, and the two are
# one bracket: when either fills the other is cancelled at once.
#
# Two readings of "10x", and the basis picks one:
#   premium — the target is the fill price times the multiple. A $2.10 fill
#             rests a sell at $21.00.
#   risk    — the target is the fill price plus the multiple times the
#             distance to the stop. A $2.10 fill with a $1.50 stop (60 cents
#             of risk) rests a sell at $8.10.
# RULED: premium (Steve, 2026-09-15: "10x means ten times the fill
# premium"). Flipping the basis here is still a one-line edit, no code change.
# The multiple must be positive, and above 1 on the premium basis (a target
# at or under the fill is a sale, not a target). Rounded up to the tick.
take_profit_multiple: 10.0
take_profit_basis: premium
