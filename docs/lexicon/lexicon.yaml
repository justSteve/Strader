# PA Lexicon v1 — the controlled vocabulary for price-action description. [st-g9y]
#
# Source of truth for how Strader's surfaces (code enums, record fields, drill
# labels, coach speech, CLI grammar terminals) name price action. Derived from
# the measured taxonomy (docs/measurement/orderflow-fundamental-units.md,
# corpus run 20260728T123632Z) and the conflict inventory
# (docs/research/2026-07-28-pa-vocabulary-consistency-review.md).
#
# Reading guide for Steve: `on_the_chart` is what the term looks like on the
# FootPrint drill surface (or candlesticks where noted). `live` says whether
# the thing is knowable in the moment (live) or only after the fact
# (hindsight) — your yea/nay decisions can only ever be asked about live
# terms; hindsight terms are how the tape gets graded afterward.

