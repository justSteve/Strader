  live_domain:
    # CLOSED SET — Desk Ruling 7, memo 20260826T001224__Desk__rulings-7-8-and-
    # setupname, 2026-08-26. A `live:` value outside this list fails the suite.
    # A term that is genuinely two things gets TWO ENTRIES, never a fourth
    # token: one term carrying two meanings is the defect this whole review is
    # about, and `both` would ratify it into the schema. See raw-atom /
    # graded-atom for the worked case. [st-zt9b]
    live: >
      Knowable in the moment. The only value speech.py may speak — Ruling 8,
      st-hd51 — and the only one your yea/nay decisions can ride on.
    hindsight: >
      Knowable only after the fact. How the tape gets graded afterward;
      diagnostic, never a live call.
    definitional: >
      Not a question the tape can answer at all — a property of the
      definitions themselves. Named for what it is rather than `n/a`, which
      was a value that said nothing.
  term_fields:
    required: [term, tier, status, live, definition, on_the_chart]
    optional: [note]
    note_field: >
      `note` carries qualifying prose that used to sit in trailing YAML
      comments — provenance, a stamp's conditions, what would change it. A
      comment is invisible to every consumer that parses this file; a field is
      not. Prose that qualifies a term belongs here, and the banned-bare rule
      scans it like any other lexicon surface. [st-zt9b]
  conventions:
    compound_term: >
      A word that crosses domain boundaries never appears bare in a
      definition or emission — it carries a disambiguating partner word
      (delta-flip vs GEX-flip; flush-leg vs flush-stage). Bare use in
      conversation is tolerated only when context is unambiguous.
    grades_not_gates: >
      Cell, band, and archetype membership are graded coordinates, never
      identities. Say "graded F1 at 0.62", never "is F1". A coin-flip-band
      label is unreportable bare — report the straddled pair.

# Words that must NEVER appear bare in definitions, emissions, or CLI
# terminals. Each names its compounds.
banned_bare:
  - {word: flush,    compounds: [flush-stage, flush-leg]}
  - {word: stall,    compounds: [stall-stage, absorption-stall, micro-stall]}
  - {word: flip,     compounds: [flip-stage, delta-flip, GEX-flip]}
  - {word: confirm,  compounds: [confirm-stage, confirmation-event]}
  - {word: trap,     compounds: [leg-boundary-trap, trapped-trader-level]}
  - {word: pivot,    compounds: [pivot-atom, pivot-level]}
  - {word: grind,    compounds: [leg-grind]}
  - {word: probe,    compounds: [probe-atom, probe-fade, auction-probe]}
  - {word: boundary, compounds: [cell-boundary, leg-boundary-trap]}
  - {word: beat,     compounds: []}   # retired outright — "stages" ruling 2026-07-09
  - {word: move,     compounds: [leg]}  # unit sense; moves.jsonl keeps its filename
  - {word: level,    compounds: [plan-level, price-level, tick-level]}  # when ambiguity is possible
  - {word: band,     compounds: [grade-band, VWAP-band]}  # certainty stripe vs price envelope — Steve catch 2026-07-28
  - {word: terminal, compounds: [command-token, console-terminal]}  # grammar jargon retired — Steve catch 2026-07-28
  - {word: cut,      compounds: [cutpoint]}  # classification line vs cutting a position — Steve catch 2026-07-28

terms:
  # ── Axes (the measuring sticks) ──────────────────────────────────────────
  - term: effort
    tier: axis
    status: ratified
    live: live
    definition: Unsigned volume traded in a unit — how much fuel was spent.
    on_the_chart: Cell brightness and the size of the footer volume number.
  - term: effect
    tier: axis
    status: ratified
    live: live
    definition: >
      Price movement produced. Two faces: displacement (close minus open,
      signed) and travel (high minus low). A unit can travel far and
      displace nothing — that is a fight, not stillness.
    on_the_chart: How far the column's cells span (travel) vs where it closes relative to where it opened (displacement).
  - term: force
    tier: axis
    status: ratified
    live: live
    definition: >
      Signed delta — buy-aggression minus sell-aggression. NOT the same as
      effort (unsigned). The two axes are never interchangeable.
    on_the_chart: The footer delta number and its color.
  - term: travel-ratio
    tier: axis
    status: ratified
    live: live
    definition: >
      Displacement divided by travel, 0-1. 1 = one-way traffic; near 0 =
      full round trip inside the unit. Marks structure the unit's net hides.
    on_the_chart: A tall column that closes where it opened has travel-ratio near 0 — the wick-heavy silhouette.
  - term: pace
    tier: axis
    status: ratified
    live: hindsight
    definition: Leg extreme-points per minute; corpus tercile cutpoints 0.38 / 0.75.
    on_the_chart: How steep the leg looks on the candle companion chart.
  - term: giveback
    tier: axis
    status: ratified
    live: hindsight
    definition: >
      Fraction of a leg's extreme surrendered by its end. Measured fact:
      big legs keep what they take (flush-leg median giveback 0.05);
      giveback concentrates in small legs.
    on_the_chart: The pullback from the leg's furthest point before the next leg starts.

  # ── Grade bands (how sure a label is) ────────────────────────────────────
  - term: cutpoint
    tier: band
    status: ratified
    live: definitional
    definition: >
      A dividing line in a classification — pace 0.75 is the flush-leg
      cutpoint; the archetype-grade measures distance from it. Distinct
      from a threshold, which TRIGGERS an event when crossed (the reversal
      threshold ends a leg; the 150-contract delta threshold fires the
      flip-stage). Cutpoints sort; thresholds act. Bare "cut" is banned in
      definitions — in speech it keeps its trading sense: cutting a position.
    on_the_chart: Nothing — cutpoints live in the grading, not on the tape.
    note: >
      A property of the definitions, not of the tape, so the tape can never be
      asked about it — which is why `live:` reads `definitional` and not the
      older `n/a`, a value that said nothing. [st-zt9b]
  - term: coin-flip band
    tier: band
    status: ratified
    live: hindsight
    definition: >
      Grade <= 0.1 — within a whisker of the cell-boundary. 20.4% of atoms,
      19.3% of legs. Unreportable as a cell claim; report the straddled
      pair ("F3/F4 coin-flip"). Banned as a bare command token in the CLI grammar.
    on_the_chart: A column you could argue either way about — the honest label admits it.
  - term: lean band
    tier: band
    status: provisional   # collides with directional "lean" — ruling-round flag
    live: hindsight
    definition: Grade 0.1-0.3 (32.5% atoms / 28.7% legs). Reportable with the grade-band attached.
    on_the_chart: Readable but not shout-it-across-the-room.
  - term: solid band
    tier: band
    status: ratified
    live: hindsight
    definition: Grade 0.3-0.6 (31.3% / 29.0%). Reliable.
    on_the_chart: You would call it the same way twice.
  - term: strong band
    tier: band
    status: ratified
    live: hindsight
    definition: Grade > 0.6 (15.8% / 23.0%). Survives any reasonable reclassification.
    on_the_chart: Unmistakable — the textbook example you would screenshot.
  - term: grade-band
    tier: band
    status: ratified
    live: hindsight
    definition: >
      Which stripe of certainty a grade falls in — coin-flip, lean, solid,
      strong — and the name for that four-way scale itself. Hindsight because
      a grade is day-relative: it ranks a unit against the whole session, so
      no grade-band can be known until the session is.
    on_the_chart: Nothing directly — it is the certainty stripe on a label, not a mark on the tape.
    note: >
      Registered by Desk Ruling 13a, 2026-08-26. It was a term in everything
      but registration: named in banned_bare's compounds since 2026-07-28,
      used normatively in conventions.grades_not_gates ("report it with the
      grade-band attached"), and carried in the hand-written denylist st-hd51
      retired. Registering it is what puts it in the derived refusal set,
      which is the point of Ruling 8 — the entry does the work, not a list
      somewhere. Distinct from VWAP-band, the price envelope; that collision
      is why the bare form is banned, and this entry's first draft used it
      four times in its own prose until the linter said so.

  # ── Atom tier (1 minute) ─────────────────────────────────────────────────
  - term: raw-atom
    tier: atom
    status: ratified
    live: live
    definition: >
      One clock minute of tape as measured: net, range, travel-ratio, effort,
      force. Complete at minute close — nothing in it waits on the rest of the
      day, which is what makes it the live half of the minute.
    on_the_chart: Roughly 2-4 footprint columns' worth of tape at typical pace (columns are volume-bars, not minutes).
    note: >
      Was one term `atom` carrying both halves, stamped
      `live (raw) / hindsight (graded)`. Split by Desk Ruling 7, 2026-08-26 —
      one term with two availabilities is one term with two meanings, and the
      `both` token was refused rather than ratified into the schema. The
      partner entry is graded-atom. [st-zt9b]
  - term: graded-atom
    tier: atom
    status: ratified
    live: hindsight
    definition: >
      The same minute once it carries its percentile grades and F-cell. Those
      are day-relative — each one ranks the minute against every other minute
      of the session — so they cannot exist until the session does.
    on_the_chart: The same column, once the day's grading has colored it.
    note: >
      The hindsight half of the split described in raw-atom. Every F-cell and
      grade-band term in this tier reads a graded-atom, never a raw one.
      [st-zt9b]
  - term: F1 conviction
    tier: atom
    status: ratified
    live: hindsight
    definition: High effort AND high effect — the movement is being paid for. 34.7% of atoms.
    on_the_chart: Bright cells, wide span, big footer delta agreeing with direction.
  - term: F2 absorption
    tier: atom
    status: ratified
    live: hindsight
    definition: >
      High effort, low effect — someone is standing there. 16.0% of atoms.
      82.5% of all range-travel the 1-minute lens discards hides inside F2
      cells: absorption minutes are internally violent.
    on_the_chart: Bright cells piled at the same prices, column going nowhere — the pile-up without the march.
  - term: F3 hollow
    tier: atom
    status: ratified
    live: hindsight
    definition: Effect without effort — price drifting on air. 22.4% of atoms.
    on_the_chart: Dim cells but the column spans far; nobody paid for the trip.
  - term: F4 dead
    tier: atom
    status: ratified
    live: hindsight
    definition: Neither effort nor effect. 26.9% of atoms.
    on_the_chart: Dim, short, forgettable.
  - term: doji-atom
    tier: atom
    status: ratified
    live: live
    definition: Travel-ratio exactly 0 (open = close). 8.0% of atoms — the pure-rotation marker.
    on_the_chart: The column that ends where it began.
  - term: probe-atom
    tier: atom
    status: ratified
    live: hindsight
    definition: >
      High-effort round-trip minute (effort_pct > 80, travel < 0.3).
      ~6.7/day, 75.3% graded F2. Confirmation events co-locate with them
      at 37.1% vs a 16.2% base — but no better than high-effort one-way
      minutes: effort is the signal, the round trip is texture.
    on_the_chart: A violent column that slams back to where it started — the sub-minute fight compressed.
  - term: pivot-atom
    tier: atom
    status: ratified
    live: hindsight
    definition: >
      The shared border minute between consecutive legs (leg k's last =
      leg k+1's first). 63% graded F1 — legs die hot, by opposition, not
      exhaustion.
    on_the_chart: The loud column at the turn — NOT a quiet fade.
  - term: micro-stall
    tier: atom
    status: ratified
    live: hindsight
    definition: >
      The interior "1-2-1" cell motif — conviction, absorption, conviction
      resuming — a sub-leg pause. Partner word micro- distinguishes it from
      stall-stage (episode tier). The parry FAILS here: the leg continues.
      If the parry holds and force turns, you were watching a stall-stage
      instead — indistinguishable in the moment, named only in hindsight.
    on_the_chart: A thrust, a parry that fails, the thrust resumes (Steve's fencing frame, 2026-07-28). Bright / pinned / bright again, leg unbroken.

  # ── Leg tier (the archetypes) ────────────────────────────────────────────
  - term: zigzag decomposition
    tier: leg
    status: ratified
    live: hindsight
    definition: >
      The drawing rule that produces legs: redraw the day with the fewest
      alternating strokes that capture every swing bigger than the reversal
      threshold (20% of the day's final high-low range, floor 1.5 pts). A
      stroke extends while price makes new extremes its way; a
      beyond-threshold retracement ends it at its furthest point and starts
      the opposite stroke. Sub-threshold wiggle is absorbed into the stroke
      it happened during. Doubly hindsight: the threshold needs the final
      range, and a stroke's end is knowable only after the retracement.
      (Charting platforms ship the same idea as the ZigZag indicator,
      usually fixed-percent; ours is day-relative.)
    on_the_chart: The day traced with the fewest pen strokes — on 7/22 the threshold was 7.65 pts and the day compressed to four strokes.
  - term: leg
    tier: leg
    status: ratified
    live: hindsight
    definition: >
      One element of the day's zigzag (reversal threshold 20% of final day
      range, floor 1.5 pts). Median 15 min, 7.25 pts. The unit the
      archetypes name. ("Move" is retired as a unit word; option-structure
      legs must compound as option-leg / spread-leg.)
    on_the_chart: One directional swing on the candle companion — the thing you'd draw with one pen stroke.
  - term: flush-leg
    tier: leg
    status: ratified
    live: hindsight
    definition: >
      Fast and big — pace >= 0.75, effect >= 70. 13.7% of legs; median
      16.75 pts in 16 min, giveback 0.05. 76% occur on D-days. The
      tradeable V-dump leg.
    on_the_chart: The steep cliff. On candlesticks — the elevator-down (or up) you already recognize.
  - term: steady-leg
    tier: leg
    status: ratified
    live: hindsight
    definition: >
      Mid-pace pure-conviction residual; the most force-confirmed class
      (alignment 0.95). ~18% of legs. The "trust the tape" reference.
    on_the_chart: A clean staircase — direction, pace, and delta all agreeing.
  - term: leg-grind
    tier: leg
    status: ratified
    live: hindsight
    definition: >
      Slow but big — pace < 0.38, effect >= 70. 6.0% of legs, median 66
      min. Over-indexes P-days (trend-day crawl).
    on_the_chart: The all-afternoon escalator that never gives an entry.
  - term: counterforce-leg
    tier: leg
    status: ratified
    live: hindsight
    definition: >
      Big leg whose delta disagrees with its direction (effect >= 60,
      force misaligned). 4.2%; skews DOWN 41/28 — price falling through
      net buying: trapped-buyer drops. (Renamed from "squeeze-leg" — squeeze
      is an up-cloud word; the bare name would have baked in a direction
      inversion.)
    on_the_chart: Falling prices with blue (buy) footers — the tape arguing with itself. Direction Inversion Watch territory.
  - term: absorption-stall
    tier: leg
    status: ratified
    live: hindsight
    definition: Leg-scale F2 — heavy effort, little net progress. 9.6% of legs.
    on_the_chart: A fat sideways smear of bright columns.
  - term: hollow-glide
    tier: leg
    status: ratified
    live: hindsight
    definition: Leg-scale F3 — distance covered on thin participation. ~8% of legs.
    on_the_chart: A drift you could wave your hand through.
  - term: probe-fade
    tier: leg
    status: ratified
    live: hindsight
    definition: >
      Small leg that pokes out and surrenders it — giveback >= 0.30 with
      effect < 50. 7.8% of legs.
    on_the_chart: The failed little excursion — out, nothing there, back.
  - term: dead-drift
    tier: leg
    status: ratified
    live: hindsight
    definition: The residual majority — 32.4% of legs. Nothing happening, honestly labeled.
    on_the_chart: The chop between the stories.

  # ── Day tier ─────────────────────────────────────────────────────────────
  - term: day-sequence
    tier: day
    status: ratified
    live: hindsight
    definition: >
      The session's ordered archetype string — a day-type read from the
      inside. 2026-07-22 reads flush-leg, steady-leg, leg-grind, steady-leg.
    on_the_chart: The day's story told in four to eight words.

  # ── Episode tier (the recognizer's live world — your existing words live here) ──
  - term: episode
    tier: episode
    status: deferred   # container word unresolved: engagement / instance / recognition / episode
    live: live
    definition: >
      The recognizer's unit of work at 2,000-contract bar resolution — one
      engagement of one anchor through the four stages. LIVE — this is the
      tier that emits in real time and the tier your yea/nay rides on.
    on_the_chart: The Anatomy row in the drill; the thing the coach arms and walks.
  - term: flush-stage
    tier: stage
    status: ratified
    live: live
    definition: >
      Stage 1 — aggressive break through a price-level. Sub-minute;
      invisible to atoms. Leg-scale correlate: the flush-leg.
    on_the_chart: The spike through the armed plan-level — often inside a single column.
  - term: stall-stage
    tier: stage
    status: ratified
    live: live
    definition: >
      Stage 2 — aggression continues, extreme stops extending. Atom-scale
      correlate: F2-in-tail (absorption-death), which lifts the
      confirm-conditional from 0.46 to 0.60.
    on_the_chart: The parry that HOLDS — sellers still thrusting, lows shrinking, nothing given (7/22 footers 1-3).
  - term: flip-stage
    tier: stage
    status: ratified
    live: live
    definition: >
      Stage 3 — delta turns against the break (threshold 150 contracts,
      ~7% of bar volume: machine-legible, not eye-legible). Its 1-minute
      shadow is the pivot-atom.
    on_the_chart: You will NOT see it in cells; the coach calls it. Footer sign change is the after-the-fact trace.
  - term: confirm-stage
    tier: stage
    status: ratified
    live: live
    definition: >
      Stage 4 — a close back across the price-level with opposite evidence. The
      recognizer emission is a confirmation-event. Atom correlate: the
      conviction head ("11"/"111" leg openings).
    on_the_chart: The retake candle/column closing back through the price-level.
  - term: sweep-print
    tier: primitive
    status: ratified
    live: live
    definition: >
      One aggressive order eating multiple book price-levels (>= 3 ticks).
      Your candlestick-hindsight "sweep" — it kept its name, compounded.
    on_the_chart: The long single-print tail; on candles, the wick you already spot.
  - term: absorption-read
    tier: primitive
    status: ratified
    live: live
    definition: >
      Book-level verdict — aggressor threw size, passive side refilled
      (from MBP-1 quotes). Outcome word (held/broke/lifted-away) is
      currently prose-only; enum field is queued code work.
    on_the_chart: Price pinned while the footer volume climbs; needs book data to grade.
  - term: delta-divergence
    tier: primitive
    status: ratified
    live: live
    definition: New price extreme on weaker aggression than the prior extreme — the exhaustion tell.
    on_the_chart: New low, smaller red footer than the last low made.
  - term: imbalance-stack
    tier: primitive
    status: ratified
    live: live
    definition: ">= 3 consecutive diagonal bid/ask dominances (3:1) — one side owning a price ladder."
    on_the_chart: A diagonal run of lopsided cells.

  # ── Level compounds (the three senses the bare word hides) ───────────────
  # banned_bare has named these as the permitted replacements for "level"
  # since 2026-07-28 but never defined them, so nothing could point AT them.
  # The emission schema below binds fields to terms, which requires the term
  # to exist. Definitions here are conformance to the 07-28 ruling, not new
  # vocabulary. ladder-rung is the one addition: the emission review
  # (2026-08-25, finding 2) named it as the replacement for the spoken
  # imbalance line's bare "levels", in its own act-without-asking pile.
  - term: tick-level
    tier: unit
    status: ratified
    live: live
    definition: >
      One distinct price a sweep-print's aggressor walked through, counted in
      ticks of the instrument. The sweep's only number. NOT a plan-level:
      three tick-levels on /ES is half a point, which is why the bare word
      misled — the same log line carries plan-levels four digits wide.
    on_the_chart: Each price the single-print tail covers, one cell per tick.
  - term: ladder-rung
    tier: unit
    status: ratified
    live: live
    definition: >
      One price row of the bid/ask ladder inside a footprint column. What an
      imbalance-stack stacks: three consecutive rungs one side dominated.
      Distinct from tick-level (a sweep's path) and plan-level (a price from
      the letter) though all three are prices.
    on_the_chart: One horizontal cell pair in the column.
  - term: plan-level
    tier: unit
    status: ratified
    live: live
    definition: >
      A price carried into the session as structure to trade against —
      Mancini's letter levels, the profile's POC/HVN/LVN, the prior day's
      range edges. The only one of the three a level-state attaches to.
    on_the_chart: The horizontal line drawn before the open, with its state word in the HUD.
  - term: price-level
    tier: unit
    status: ratified
    live: live
    definition: >
      A price the stage vocabulary breaks or retakes, named without claiming
      it came from the plan. flush-stage goes through a price-level;
      confirm-stage closes back across it.
    on_the_chart: Wherever the stage sequence happened — marked after the fact, not drawn before.

  # ── Level-state tier (the Pine renderer's close-based words) ─────────────
  - term: level-state
    tier: level-state
    status: ratified
    live: live
    definition: >
      The renderer's per-plan-level state machine, close-based:
      untouched -> tested/held -> broken -> reclaimed. RECLAIMED is the
      failed-breakdown pattern rendered in place — the same market event
      the episode tier confirms from orderflow, on a slower clock.
    on_the_chart: The plan-level line's color/style and state word in the HUD on the /ES chart.

  # ── Cross-tier signatures (the trading discoveries) ──────────────────────
  - term: V-signature
    tier: signature
    status: ratified
    live: hindsight
    definition: >
      Prior down flush-leg <= -8 pts, confirmation-event within 3 min of
      the new up-leg. 77.5% wins vs 46.9% base (31/40, hindsight
      attribution). The measured V-dump fly entry.
    on_the_chart: The cliff, the turn, the immediate retake — your butterfly setup in taxonomy words.
    note: >
      Hindsight today because the attribution is hindsight. The live trigger —
      a provisional-pivot that would call the prior down flush-leg before the
      leg closes — is unbuilt future work; `live:` flips to `live` if it ever
      ships. [st-zt9b]
  - term: host-leg
    tier: signature
    status: ratified
    live: hindsight
    definition: >
      The leg containing a confirmation-event. Direction agreement splits
      win rate 66% vs 19% — the strongest single hindsight separator.
      Stays a diagnostic until a live proxy exists.
    on_the_chart: Is the setup swimming with or against the swing it lives inside.
  - term: leg-boundary-trap
    tier: signature
    status: ratified
    live: hindsight
    definition: >
      Down-leg dying by absorption (F2 tail) then an up-leg opening on
      conviction — the four-stage sequence at leg scale. 27.6% of down-up
      pairs; stall-conditional 0.60 vs 0.46.
    on_the_chart: Pile-up at the low, loud turn, bright staircase out.

# ═══════════════════════════════════════════════════════════════════════════
# EMISSION SCHEMA — how the words above reach a surface. [st-bkvt]
# ═══════════════════════════════════════════════════════════════════════════
#
# Desk Ruling 1, requirement 5 (memo 20260825T143000, re-sequenced to LEAD by
# the 18:00 amendment): emission strings are never hand-formatted. They render
# from a mapping of field to canonical display name per surface, and that
# mapping lives here.
#
# THE DEFECT THIS EXISTS TO MAKE IMPOSSIBLE. One number — how many distinct
# prices a sweep's aggressor walked — went by three words at once: the field
# said `ticks_swept`, the written line said "3 levels", the spoken line said
# "three ticks", and the ratified word was a fourth thing, tick-level. Nothing
# was broken; nobody had lied; the three surfaces had simply each been written
# by hand. A linter can only catch that AFTER someone writes it wrong.
#
# THE MECHANISM. A template never contains a field's name. It contains slots
# and connective tissue only. The word that names a quantity is written once,
# in `quantities` below, and every surface pulls it from there. So there is no
# edit that gives one number two words — you would have to add a second
# quantity binding the same field, and market/emission/renderer.py refuses to
# LOAD a lexicon that does — the whole file, at first import, not at the first
# emission. Its tests are tests/market/emission/test_render.py.
# Point-of-write validation, which Desk named as the principle behind this
# ruling (18:00 amendment, process note) after a ledger writer let a bad KIND
# through because its check ran after the string was already built.
#
# WHAT IS NOT HERE YET. Migration is deliberately partial: SweepPrint and
# ImbalanceStack render from this schema, and the rest of the estate does not.
# Desk's build order — schema, then the heartbeat as its first citizen, then
# the evidence pass, then renames as migration consequences — puts the
# remaining surfaces on their own beads (st-cua1 plan-level, st-1s1 SetupName,
# st-mieu heartbeat). Adding one is a `templates` row plus a call site, and
# the renames those beads carry become one-line edits HERE rather than a
# search across three files.

emission:
  meta:
    bead: st-bkvt
    ruled_by: >
      Desk Ruling 1 item 5, memo 20260825T143000__Desk__lexicon-ruling-scope-
      boundary; re-sequenced to lead by 20260825T180000__Desk__rulings-amended-
      on-dissent. Consumed by market/emission/renderer.py.
    second_consumer: >
      Desk also ruled this term set is the controlled identifier list for the
      signal ledger's strategy/emission join key — one ratification, two
      consumers. `quantities[].id` and `templates[].id` are that list. They are
      lexicon term names, not invented ids, so a ledger row and an emission
      string cannot come to disagree about what a thing is called.

  # ── Surfaces ────────────────────────────────────────────────────────────
  # A surface is a place an emission is rendered FOR someone. Two exist. The
  # tmux pane (present/signals.py) is not a third — it prints `reason`
  # verbatim, so it is a consumer of the reason surface, not a surface.
  surfaces:
    - id: reason
      renders_to: Signal.reason
      audience: >
        The written line: the log, the pane, the postmortem, the replay
        record. Read by Steve and by the harness both, so it stays terse and
        keeps the measurement vocabulary.
      numbers: digits
      prices: decimal2      # 7555.00
      span_join: "->"
      sentence_case: false
      live_only: false      # the written record may carry hindsight quantities
    - id: speech
      renders_to: present/speech.py
      audience: >
        The spoken line, heard while the tape is moving. Plain words, numbers
        as words, prices in trader idiom. This is the surface st-v95 was
        raised over.
      numbers: words
      prices: spoken        # "seventy-five fifty-five"
      span_join: " to "
      sentence_case: true
      live_only: true       # speaking a hindsight quantity asserts the unknowable

  # ── Emission names ──────────────────────────────────────────────────────
  # What an emission calls ITSELF, written once. A rename — Ruling 3 defers
  # one for the delta-percentile kind — is a one-line edit here, not a search
  # across engine, speech, fixtures and log parsers.
  names:
    - id: sweep-print
      term: sweep-print
      display: sweep
      note: >
        Displayed as the short form; `sweep-print` is the ratified compound
        and stays the identifier. Review finding 13 notes "sweep" also names a
        parameter sweep in about eight engineering scripts — never in front of
        Steve, recorded so a future rename does not walk into it.

  # ── Quantities ──────────────────────────────────────────────────────────
  # The unit of the whole mechanism: a thing an emission can carry a value of,
  # its ONE display word, and the fields that hold it. `fields` is the join —
  # `Signal.field`, fully qualified, because `direction` and `price` recur
  # across signal types and a bare field name would silently merge them.
  #
  # RULE, enforced at load by market/emission/renderer.py: a field appears in
  # at most one quantity. That is what makes one number with two words
  # unwritable. Test: test_one_field_in_two_quantities_is_refused.
  quantities:
    - id: tick-level
      term: tick-level
      kind: count
      live: live
      display: {one: tick-level, many: tick-levels}
      fields: [SweepPrint.ticks_swept]
    - id: ladder-rung
      term: ladder-rung
      kind: count
      live: live
      from: length          # the value is the price tuple; the count is its len()
      display: {one: ladder-rung, many: ladder-rungs}
      fields: [ImbalanceStack.prices]
      note: >
        Declared with no template yet, which is legal: a quantity is the WORD,
        a template is a rendering that uses it. ImbalanceStack says "N levels"
        on both its surfaces today (present/speech.py, and the written line at
        market/orderflow/imbalance.py:69). Migrating one surface alone would
        put two words on one field, so both go together on st-iq9g — and the
        word they migrate onto is already ratified, here.
    - id: contract
      kind: count
      live: live
      display: {one: contract, many: contracts}
      fields: [SweepPrint.total_size]
      note: >
        No lexicon term: a contract is the instrument's unit, not price-action
        vocabulary. Declared here so the word still has one home and the
        renderer can pluralize it.
    - id: aggressor-side
      kind: enum
      live: live
      values: {buy: buy, sell: sell}
      fields: [SweepPrint.direction, ImbalanceStack.direction]
      note: >
        Two fields, one quantity — legitimately the same thing on both types.
        The surface decides case (speech capitalizes the sentence); the word
        itself is written once, here.
    - id: swept-span
      kind: price-span
      live: live
      fields: [SweepPrint.span]
      note: >
        A (start, end) pair. Not two price fields, because the pair IS the
        quantity — st-jg77's finding is that the span and the size predict
        what the tick-level count does not, and it wants them led with.
    - id: sweep-end
      kind: price
      live: live
      fields: [SweepPrint.end_price]
      note: >
        The spoken line says where the sweep ENDED — where price is now —
        and omits where it began, because by the time it is heard the start
        is history. The written line keeps both as the span.

  # ── Templates ───────────────────────────────────────────────────────────
  # Connective tissue and slots. NEVER a field's display word — that is the
  # whole point. Enforced by tests/market/emission/test_render.py:
  # test_no_template_contains_a_field_display_word, and its partner test
  # applies the 07-28 bare-word ban to templates as well, since a template is
  # every future instance of that emission at once.
  #
  # Slot forms:
  #   {field}        value + its quantity's display word ("3 tick-levels")
  #   {field:bare}   value alone, no word — for when the tissue already names it
  #   {@name}        the emission's own display name from `names` above
  #
  # A surface key absent from a template means that surface does not render
  # this emission at all — a deliberate silence, not an oversight.
  templates:
    - id: sweep-print
      signal: SweepPrint
      name: sweep-print
      surfaces:
        reason: "{direction} {@name} {span} ({ticks_swept}, {total_size})"
        speech: "{direction} {@name}, {ticks_swept} through to {end_price}, {total_size}."
      note: >
        The whole emission, both surfaces, which is the point — this is the
        one the review is named for and it is migrated completely rather than
        half. The written line keeps the span and drops nothing; the spoken
        line omits where the sweep BEGAN, because by the time it is heard the
        start is history and the end is where price is now.
        st-jg77 wants this line led by span and size rather than the
        tick-level count. Under this schema that is an edit to the two strings
        above and nothing else — no code, no second surface to keep in step.
