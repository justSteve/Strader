name: CI

# Runs the Strader package tests plus the carried-infra suites that are
# stdlib+repo-only (no live feed / API keys), so CI is fast and deterministic.
# The pilot's runbook + corpus tests are included explicitly because the
# pytest config's default testpaths is just strader/tests. The feed-touching
# WIP suites (tests/market/pricing, tests/market/test_ingest_databento) are
# intentionally omitted until their optional deps are pinned. [st-cir]

on:
  push:
    branches: [master]
  pull_request:

# Cancel an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # No `cache: pip`: its dependency-hash glob walks the whole workspace
          # and dies with EACCES on a checked-in .beads/formulas/*.toml file.
          # The install is tiny (pytest + editable pkg), so caching buys nothing.

      - name: Install (editable + dev deps)
        # httpx is needed by the gexbot ingest/stream modules (market/ingest/
        # gexbot.py, market/corpus/gexbot_stream.py). The runbook pilot no
        # longer needs it — its API extraction path was removed in st-26q5.
        # The feed/broker libs (databento, schwab-py) are intentionally NOT
        # installed — their suites are excluded below until those deps are pinned.
        # flask IS installed: the fire server (scripts/fire_server.py) is pure
        # stdlib+flask, its 16 rail tests are exactly the kind CI should run,
        # and the dep is tiny. [st-fixci]
        # cryptography IS installed: execd/vault.py is the credential vault and
        # it is NOT a feed/broker lib — it is a plain wheel. Without it
        # tests/scripts/test_execd_two_apps.py could not be collected, which
        # was one of the three errors that had master red. The two-app split is
        # exactly the kind of security-shaped logic CI should be running.
        # [st-v55j]
        run: python -m pip install --upgrade pip && pip install -e ".[dev]" httpx flask cryptography

      - name: Run tests
        # strader package + the carried-infra suites that run without the live
        # feed/broker libs. test_paths.py is named explicitly to skip the
        # databento/schwab tests that share tests/market/corpus/.
        # pythonpath=["."] (pyproject) makes market.*/runbook.* importable.
        # tests/test_alerts.py is named explicitly: it is stdlib-only and was
        # otherwise unrun by CI, sitting outside every listed path.
        run: pytest strader/tests tests/runbook tests/market/corpus/test_paths.py tests/scripts tests/market/entities tests/market/orderflow tests/test_alerts.py
